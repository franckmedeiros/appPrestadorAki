name: prestadoraki
description: "PrestadorAki — app do prestador (agenda, clientes, orçamentos e rastreamento)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # SDK do próprio Flutter (não vem do pub.dev, por isso não tem versão) —
  # sem isso o MaterialApp não tem os delegates de localização, e alguns
  # teclados Android (Gboard em pt-BR incluso) atropelam a composição de
  # acento/cedilha (ã, ç, é) sem o app declarar que suporta pt-BR. Ver
  # main.dart (localizationsDelegates/supportedLocales).
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  geolocator: ^13.0.0
  geocoding: ^4.0.0

  # Chama Cloud Functions do app (confirmar assinatura do prestador).
  cloud_functions: ^6.3.6

  # Assinatura mensal (Google Play Billing) — só quem assina consegue
  # virar prestador (aparecer na busca). Ver lib/core/subscription_service.dart
  # e functions/src/subscription.ts.
  in_app_purchase: ^3.2.0

  # Notificações push (central de notificações — sininho, igual ao app
  # Resenha): firebase_messaging entrega o push de verdade (mesmo com o
  # app fechado), flutter_local_notifications mostra a notificação na
  # hora quando o app está ABERTO (o Android não faz isso sozinho nesse
  # caso). Ver lib/core/notification_service.dart.
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Só gera os arquivos de ícone (ver config abaixo) — não entra no app
  # final, é rodado uma vez à mão (`dart run flutter_launcher_icons`)
  # sempre que a arte do ícone mudar.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    # Lista de estados + cidades do Brasil (nomes oficiais, com
    # acentuação correta) — usada pelos seletores de Estado/Cidade em
    # "Editar perfil"/"Virar prestador" (ver lib/core/brazil_locations.dart).
    # Empacotada como asset em vez de consultar uma API toda hora: fica
    # disponível offline e não depende de nenhum serviço externo no ar.
    - assets/data/br_locations.json

# Configuração do flutter_launcher_icons — corrige o ícone do Android
# aparecer pequeno e apertado dentro de um círculo branco (o Franck
# reparou comparando com o app Resenha, que preenche o círculo todo).
# Causa: o app nunca tinha um "ícone adaptativo" (Android 8+) de verdade,
# só o PNG quadrado antigo — sem uma camada de primeiro plano/fundo
# separadas, o launcher (reparado num Moto) encolhe o ícone inteiro e
# desenha ele dentro de um círculo branco por conta própria, pra não
# cortar as bordas. `adaptive_icon_foreground` é só o glifo do pin+casa
# (extraído do ícone atual, sem as linhas decorativas — elas ficam fora
# da "área segura" central que o Android garante visível em qualquer
# formato de máscara do launcher), e `adaptive_icon_background` é a cor
# de marca sólida, preenchendo o círculo/quadrado inteiro sem cortar nada.
# `image_path` continua sendo a arte completa de sempre — usada como está
# pro ícone do iOS e como alternativa pra Android < 8 (que não têm ícone
# adaptativo).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"
  adaptive_icon_background: "#E7502E"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  min_sdk_android: 21
