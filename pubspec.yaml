name: prestadoraki
description: "PrestadorAki — app do prestador (agenda, clientes, orçamentos e rastreamento)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # SDK do próprio Flutter (não vem do pub.dev, por isso não tem versão) —
  # sem isso o MaterialApp não tem os delegates de localização, e alguns
  # teclados Android (Gboard em pt-BR incluso) atropelam a composição de
  # acento/cedilha (ã, ç, é) sem o app declarar que suporta pt-BR. Ver
  # main.dart (localizationsDelegates/supportedLocales).
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  local_auth: ^2.3.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  geolocator: ^13.0.0
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
