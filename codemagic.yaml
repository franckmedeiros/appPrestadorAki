  # Gera o .aab ASSINADO e para por aí — nada vai pro Google Play.
  #
  # No `android-release`, se a credencial do Play falha, o build inteiro
  # é marcado como falho e você fica SEM o arquivo, mesmo que a
  # compilação tenha dado certo. Foi o que aconteceu três vezes. Aqui
  # não tem publicação pra falhar: o .aab aparece em Artifacts pra
  # download, e o upload no Play Console é à mão.
  android-aab:
    name: Android - so gerar o AAB assinado (sem publicar)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      android_signing:
        - prestadoraki_upload
      vars:
        PACKAGE_NAME: "com.opoutsourcing.prestadoraki"
    scripts:
      - name: Instalar dependências
        script: flutter pub get
      - name: Build AAB assinado (release)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - franck.medeiros.silva@gmail.com
        notify:
          success: true
          failure: true